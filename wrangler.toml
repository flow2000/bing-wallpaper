# Cloudflare Workers 静态资源部署配置
# 部署方式：Cloudflare Git 集成（Workers Builds），push 到 master 自动构建部署
# [build].command 由 Workers Builds 执行：npm ci 复现依赖后打包 dist
# NODE_OPTIONS=--openssl-legacy-provider：webpack 3 在 Node 17+ 需要（md4 hash）
# Node 版本由 .nvmrc 固定为 20
# assets.directory 只发布构建产物 dist/
# not_found_handling 由 Workers 原生处理 SPA 回退，无需在 _redirects 中写 catch-all
name = "www-bimg"
compatibility_date = "2024-09-01"

[build]
command = "npm ci && NODE_OPTIONS=--openssl-legacy-provider npm run build"

[assets]
directory = "dist"
not_found_handling = "single-page-application"
