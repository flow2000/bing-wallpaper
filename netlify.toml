[build]
  publish = "dist"
  # dist/ 已由 GitHub Actions 预构建并提交到仓库，平台仅发布静态文件
  command = "echo pre-built by GitHub Actions"

[build.processing]
  [build.processing.html]
    pretty_urls = false

# SPA 回退：未匹配到静态文件时返回 index.html（由 vue-router 接管）
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
