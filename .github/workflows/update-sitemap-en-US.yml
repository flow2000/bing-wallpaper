permissions:
  contents: write
name: update-sitemap-en-US

on:
  schedule:
    # 每天美国太平洋时间 00:55（比 bing-wallpaper-api 数据更新的 00:50 迟 5 分钟）
    - cron: '55 0 * * *'
      timezone: America/Los_Angeles
  workflow_dispatch:
  repository_dispatch:
    types:
      - webhook-en-US

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    concurrency:
      group: bing-wallpaper-sitemap
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run sitemap pipeline
        uses: ./.github/actions/sitemap-pipeline
        with:
          region: en-US
          baidu-token: ${{ secrets.BAIDU_TOKEN }}
