permissions:
  contents: write
name: update-sitemap-en-CA

on:
  schedule:
    # 每天多伦多时间 00:49（比 bing-wallpaper-api 数据更新的 00:44 迟 5 分钟）
    - cron: '49 0 * * *'
      timezone: America/Toronto
  workflow_dispatch:
  repository_dispatch:
    types:
      - webhook-en-CA

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    concurrency:
      group: bing-wallpaper-sitemap
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run sitemap pipeline
        uses: ./.github/actions/sitemap-pipeline
        with:
          region: en-CA
          baidu-token: ${{ secrets.BAIDU_TOKEN }}
