permissions:
  contents: write
name: update-sitemap-zh-CN

on:
  schedule:
    # 每天北京时间 00:07（比 bing-wallpaper-api 数据更新的 00:02 迟 5 分钟）
    - cron: '7 0 * * *'
      timezone: Asia/Shanghai
  workflow_dispatch:
  repository_dispatch:
    types:
      - webhook-zh-CN

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    concurrency:
      group: bing-wallpaper-sitemap
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run sitemap pipeline
        uses: ./.github/actions/sitemap-pipeline
        with:
          region: zh-CN
          baidu-token: ${{ secrets.BAIDU_TOKEN }}
