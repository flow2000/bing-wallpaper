permissions:
  contents: write
name: update-sitemap-de-DE

on:
  schedule:
    # 每天柏林时间 00:25（比 bing-wallpaper-api 数据更新的 00:20 迟 5 分钟）
    - cron: '25 0 * * *'
      timezone: Europe/Berlin
  workflow_dispatch:
  repository_dispatch:
    types:
      - webhook-de-DE

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    concurrency:
      group: bing-wallpaper-sitemap
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run sitemap pipeline
        uses: ./.github/actions/sitemap-pipeline
        with:
          region: de-DE
          baidu-token: ${{ secrets.BAIDU_TOKEN }}
