permissions:
  contents: write
name: update-sitemap-en-GB

on:
  schedule:
    # 每天伦敦时间 00:43（比 bing-wallpaper-api 数据更新的 00:38 迟 5 分钟）
    - cron: '43 0 * * *'
      timezone: Europe/London
  workflow_dispatch:
  repository_dispatch:
    types:
      - webhook-en-GB

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    concurrency:
      group: bing-wallpaper-sitemap
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run sitemap pipeline
        uses: ./.github/actions/sitemap-pipeline
        with:
          region: en-GB
          baidu-token: ${{ secrets.BAIDU_TOKEN }}
