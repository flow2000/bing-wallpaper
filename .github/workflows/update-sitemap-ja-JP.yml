permissions:
  contents: write
name: update-sitemap-ja-JP

on:
  schedule:
    # 每天东京时间 00:13（比 bing-wallpaper-api 数据更新的 00:08 迟 5 分钟）
    - cron: '13 0 * * *'
      timezone: Asia/Tokyo
  workflow_dispatch:
  repository_dispatch:
    types:
      - webhook-ja-JP

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    concurrency:
      group: bing-wallpaper-sitemap
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run sitemap pipeline
        uses: ./.github/actions/sitemap-pipeline
        with:
          region: ja-JP
          baidu-token: ${{ secrets.BAIDU_TOKEN }}
