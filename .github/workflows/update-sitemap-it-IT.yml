permissions:
  contents: write
name: update-sitemap-it-IT

on:
  schedule:
    # 每天罗马时间 00:31（比 bing-wallpaper-api 数据更新的 00:26 迟 5 分钟）
    - cron: '31 0 * * *'
      timezone: Europe/Rome
  workflow_dispatch:
  repository_dispatch:
    types:
      - webhook-it-IT

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    concurrency:
      group: bing-wallpaper-sitemap
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run sitemap pipeline
        uses: ./.github/actions/sitemap-pipeline
        with:
          region: it-IT
          baidu-token: ${{ secrets.BAIDU_TOKEN }}
