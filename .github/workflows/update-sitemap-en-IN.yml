permissions:
  contents: write
name: update-sitemap-en-IN

on:
  schedule:
    # 每天印度标准时间 00:19（比 bing-wallpaper-api 数据更新的 00:14 迟 5 分钟）
    - cron: '19 0 * * *'
      timezone: Asia/Kolkata
  workflow_dispatch:
  repository_dispatch:
    types:
      - webhook-en-IN

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    concurrency:
      group: bing-wallpaper-sitemap
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run sitemap pipeline
        uses: ./.github/actions/sitemap-pipeline
        with:
          region: en-IN
          baidu-token: ${{ secrets.BAIDU_TOKEN }}
