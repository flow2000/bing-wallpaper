permissions:
  contents: write
name: update-sitemap-fr-FR

on:
  schedule:
    # 每天巴黎时间 00:37（比 bing-wallpaper-api 数据更新的 00:32 迟 5 分钟）
    - cron: '37 0 * * *'
      timezone: Europe/Paris
  workflow_dispatch:
  repository_dispatch:
    types:
      - webhook-fr-FR

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    concurrency:
      group: bing-wallpaper-sitemap
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run sitemap pipeline
        uses: ./.github/actions/sitemap-pipeline
        with:
          region: fr-FR
          baidu-token: ${{ secrets.BAIDU_TOKEN }}
