name: 'Sitemap Pipeline'
description: 'Generate sitemap.xml, commit, push and submit to search engines'
inputs:
  region:
    description: 'Region code (e.g., zh-CN)'
    required: true
  baidu-token:
    description: 'Baidu submit token'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.9.12

    - name: Install Requirements
      run: pip install requests
      shell: bash

    - name: Generate sitemap.xml
      run: python scripts/generate_sitemap.py
      shell: bash

    - name: Commit sitemap.xml
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add static/sitemap.xml
        git diff --quiet && git diff --staged --quiet || git commit -m "update sitemap.xml (${{ inputs.region }})"
      shell: bash

    - name: Push changes
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ github.token }}
        branch: master

    - name: Submit to search engines
      if: always()
      continue-on-error: true
      env:
        BAIDU_TOKEN: ${{ inputs.baidu-token }}
      run: python scripts/submit_seo.py
      shell: bash
